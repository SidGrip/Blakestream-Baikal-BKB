<h3>Backup</h3>

<form class="form-horizontal">
  <fieldset>
    <div class="form-group">
      <label class="col-sm-3 col-md-2 control-label" for="bsBackupName">Backup name</label>
      <div class="col-sm-9 col-md-10">
        <input type="text" id="bsBackupName" ng-model="backupName" class="form-control"
               placeholder="my-backup" ng-disabled="backupBusy">
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-9 col-md-10 col-sm-offset-3 col-md-offset-2">
        <button type="button" class="btn btn-default"
                ng-click="bsBackupNow()"
                ng-disabled="backupBusy || !backupCsrf">Backup</button>
        <button type="button" class="btn btn-default"
                ng-click="bsBackupExportNow()"
                ng-disabled="backupBusy || !backupCsrf">Export current configuration</button>
      </div>
    </div>
  </fieldset>
</form>

<h3>Restore</h3>
<div class="row">
  <div class="col-sm-3 col-md-2">
    <div class="list-group">
      <a href="" ng-repeat="b in backups" ng-click="choose($index)" class="list-group-item" ng-class="{active:restoring==$index}">{{b.dir}}</a>
      <div class="list-group-item text-muted small" ng-show="!backups || backups.length === 0">
        (no backups yet)
      </div>
    </div>
  </div>
  <div class="col-sm-9 col-md-10">
    <div ng-show="backups && backups.length > 0 && backups[restoring] && !backups[restoring].items" class="alert alert-warning">
      There seems to be no files in this backup, this can happen if permission was denied.
    </div>
    <button type="button" class="btn btn-default" ng-click="reload()" ng-disabled="backupBusy">Reload list</button>
    <button type="button" class="btn btn-default" ng-click="restore()" ng-disabled="backupBusy || !backupCsrf || !backups.length">Restore</button>
    <button type="button" class="btn btn-default" ng-click="exportZip()" ng-disabled="backupBusy || !backups.length">Export archived backup</button>
    <button type="button" class="btn btn-default" ng-click="bsChooseBackupFile()" ng-disabled="backupBusy || !backupCsrf">Import file...</button>
    <button type="button" class="btn btn-default bs-delete-backup-btn" ng-click="bsDeleteBackup()" ng-disabled="backupBusy || !backupCsrf || !backups.length">Delete</button>

    <div class="form-inline" style="margin-top:12px;" ng-show="backups && backups.length > 0">
      <div class="form-group">
        <label for="bsRenameInput" class="control-label" style="margin-right:8px;">Rename to:</label>
        <input type="text" id="bsRenameInput" ng-model="renameInput" class="form-control"
               style="width:240px;" placeholder="new-backup-name">
        <button type="button" class="btn btn-default" ng-click="bsRenameBackup()" ng-disabled="backupBusy || !backupCsrf">Rename</button>
      </div>
      <p class="help-block" ng-show="settings.userHelp" style="margin-top:6px;">
        Letters, numbers, dot, dash, underscore. Max 64 chars.
      </p>
    </div>
  </div>
</div>

<input class="hide" type="file" id="bsBackupFile" accept=".zip,application/zip"
       onchange="angular.element(this).scope().backupImport(this.files[0]); this.value = '';">
