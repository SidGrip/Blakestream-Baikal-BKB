# Intentionally no tmpfiles rule here.
#
# The factory rootfs already ships Debian's /etc/init.d/screen-cleanup, which
# selects /var/run/screen permissions from the actual /usr/bin/screen mode:
# 0755 for setuid screen, 0775 for sgid screen, and 1777 for stock non-setid
# screen. miner-start.sh calls that cleanup path immediately before launch so
# fresh flashes and modified debug units both get the mode their screen binary
# expects.
