# /var/run is tmpfs, so /var/run/screen needs to be recreated each boot
# with mode 2775 (sgid + rwxrwxr-x). The screen binary on this Armbian
# image is sgid utmp and refuses to run if the socket dir is any other
# mode. The screen Debian package would normally ship this snippet; it
# doesn't on the factory Baikal rootfs, so we provide it.
d /var/run/screen 2775 root utmp -
