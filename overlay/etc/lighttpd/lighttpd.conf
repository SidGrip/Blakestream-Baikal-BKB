server.modules = (
	"mod_access",
	"mod_alias",
	"mod_compress",
	"mod_redirect",
	"mod_setenv",
	"mod_proxy",
#       "mod_rewrite",
)

server.document-root        = "/var/empty/blakestream-http/"
server.upload-dirs          = ( "/run/blakestream-web/uploads" )
server.errorlog-use-syslog  = "enable"
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"
server.port                 = 80


index-file.names            = ( "index.php" )
url.access-deny             = ( "~", ".inc", ".pem", ".key" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

compress.cache-dir          = "/run/blakestream-web/compress/"
compress.filetype           = ( "application/javascript", "text/css", "text/html", "text/plain" )

include_shell "/usr/share/lighttpd/create-mime.assign.pl"
include_shell "/usr/share/lighttpd/include-conf-enabled.pl"

# Port 80 has an empty document root and only redirects syntactically valid
# hostnames/IP literals. An invalid Host header can never reach PHP or /var/www.
$HTTP["scheme"] == "http" {
    $HTTP["host"] =~ "^([A-Za-z0-9.-]+|\\[[0-9A-Fa-f:]+\\])(?::80)?$" {
        url.redirect = ( "^/(.*)" => "https://%1/$1" )
    }
}

$SERVER["socket"] == "0.0.0.0:443" {
    server.document-root = "/var/www/"
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/lighttpd.pem"
    ssl.use-sslv2 = "disable"
    ssl.use-sslv3 = "disable"
    ssl.disable-client-renegotiation = "enable"
    ssl.honor-cipher-order = "enable"
    # GCM suites are TLS 1.2-only in the shipped OpenSSL 1.0.2 stack, so this
    # also prevents TLS 1.0/1.1 negotiation on lighttpd 1.4.35, which lacks a
    # separate minimum-protocol directive.
    ssl.cipher-list = "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256"
    setenv.add-response-header = ( "X-Content-Type-Options" => "nosniff", "X-Frame-Options" => "SAMEORIGIN", "Referrer-Policy" => "same-origin" )

    # ShellInABox listens only on loopback. Browser traffic uses this HTTPS
    # origin and the terminal requires the local SSH account's credentials.
    $HTTP["url"] =~ "^/terminal(?:/|$)" {
        proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 4200 ) ) )
        setenv.add-response-header = ( "X-Content-Type-Options" => "nosniff", "X-Frame-Options" => "SAMEORIGIN", "Referrer-Policy" => "same-origin", "Cache-Control" => "no-store" )
    }
}
