[Service]
Restart=on-failure
RestartSec=5s
OOMScoreAdjust=-500
ExecStartPre=/opt/scripta/bin/prepare-runtime-dir.sh
ExecStartPre=/bin/chown root:root /tmp
ExecStartPre=/bin/chmod 1777 /tmp
ExecStartPre=/bin/mkdir -p /run/lighttpd
ExecStartPre=/bin/chown www-data:www-data /run/lighttpd
ExecStartPre=/bin/chmod 0755 /run/lighttpd
ExecStartPre=/bin/mkdir -p /run/blakestream/lighttpd-compress /run/blakestream/lighttpd-uploads /run/blakestream/php-sessions
ExecStartPre=/usr/bin/touch /run/blakestream/lighttpd-access.log
ExecStartPre=/bin/chown root:www-data /run/blakestream
ExecStartPre=/bin/chmod 0775 /run/blakestream
ExecStartPre=/bin/chown -R www-data:www-data /run/blakestream/lighttpd-compress /run/blakestream/lighttpd-uploads /run/blakestream/php-sessions
ExecStartPre=/bin/chown www-data:www-data /run/blakestream/lighttpd-access.log
ExecStartPre=/bin/chmod 0700 /run/blakestream/lighttpd-compress
ExecStartPre=/bin/chmod 0755 /run/blakestream/lighttpd-uploads
ExecStartPre=/bin/chmod 0700 /run/blakestream/php-sessions
ExecStartPre=/bin/chmod 0664 /run/blakestream/lighttpd-access.log
